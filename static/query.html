<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BrickIntersect</title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<script src="app.js" defer></script>
	<link rel="icon" type="image/png" href="assets/favicon.png">
</head>

<body>
    <h1>Results</h1>
	{{range .}}
    <div style="margin-bottom: 25px;">
		<a href="{{.BricklinkUrl}}" target="_blank">
			<h3 style="margin-bottom: 0px;">{{.SetNum}}: {{.Name}}</h3>
			<img src="{{.SetImgUrl}}" alt="{{.Name}}" style="max-width: 300px">
		</a>
	</div>
	{{end}}
</body>
</html>
