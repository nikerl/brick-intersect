<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BrickIntersect</title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<script src="app.js" defer></script>
	<link rel="icon" type="image/png" href="assets/favicon.png">
</head>

<body>
	<div class="container">
		<div class="page-content">
			<center>
				<h1><img src="assets/favicon.png" style="display: inline-block; vertical-align: -0.3em; height: 1.3em; margin-right: 10px;">BrickIntersect</h1>
			</center>
			<h2>Results:</h2>
			<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 50px;">
				{{range .}}
				<div>
					<a href="{{.BricklinkUrl}}" target="_blank">
						<h3 style="margin-bottom: 0px;">{{.SetNum}}: {{.Name}}</h3>
						<img src="{{.SetImgUrl}}" alt="{{.Name}}" style="max-width: 100%">
					</a>
				</div>
				{{end}}
			</div>
		</div>
	</div>
	
</body>
</html>
