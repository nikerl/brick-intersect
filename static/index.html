<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>BrickIntersect</title>
	<link rel="stylesheet" type="text/css" href="style.css">
	<script src="app.js" defer></script>
	<link rel="icon" type="image/png" href="assets/favicon.png">
</head>

<body>
	<h1><img src="assets/favicon.png" style="display: inline-block; vertical-align: -0.3em; height: 1.3em; margin-right: 10px;">BrickIntersect</h1>
	<p>Enter 2–4 pieces with their numbers and colors to get a list of the sets that contain all pieces.</p>
	<p>Note: This tool works best with less common pieces, and not all colors are available</p>
	<div>
		<form method="POST" action="/query" id="piece-form">
			<div id="rows-container">
				<div class="row">
					<input class="piece-id-field" name="piece_ids" type="number" placeholder="Piece Num" required
						autocomplete="off">
					<div class="color-field-container">
						<input class="color-input" name="colors" type="text" placeholder="Color" required
							autocomplete="off">
						<div class="suggestions" role="listbox" aria-label="Suggestions"></div>
					</div>
					<button type="button" class="remove-row" style="margin-left: 8px;">X</button>
				</div>
			</div>
			<button type="button" id="add-row">Add Piece</button>
			<input type="submit" value="submit" style="display: block; margin-top: 16px;">
		</form>
	</div>
</body>

</html>
